<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バス運行情報システム</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; font-size: 14px; line-height: 1.6; background: #fff; }
        .header-blue { background: #0000ff; height: 5px; width: 100%; }
        .container { padding: 15px; }
        
        /* ページ制御 */
        .page { display: none; }
        .active { display: block; }

        /* メニュー */
        .menu-item { color: #0000ff; text-decoration: none; display: block; padding: 15px 0; border-bottom: 1px solid #eee; font-weight: bold; }
        .menu-item::before { content: "◆ "; color: red; }
        
        /* 入力エリア */
        input[type="text"] { width: calc(100% - 110px); padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 15px; cursor: pointer; background: #eee; border: 1px solid #999; border-radius: 4px; }
        
        /* 候補表示 */
        .suggest-area { border: 1px solid #ccc; margin-top: 10px; background: #fff; border-radius: 4px; overflow: hidden; }
        .suggest-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #eee; background: #fdfdfd; font-size: 16px; color: #333; }
        .suggest-item:hover { background: #eef; }
        
        /* 選択済みバッジ */
        .selected-box { background: #ffffcc; border: 1px solid #000; padding: 10px; margin-bottom: 15px; font-weight: bold; }
        
        /* バス接近カード */
        .bus-card { border-left: 5px solid #0000ff; padding: 12px; margin-bottom: 10px; background: #fff; border-bottom: 1px solid #ddd; box-shadow: 2px 2px 5px #eee; }
        .back-link { color: blue; cursor: pointer; display: inline-block; margin-bottom: 15px; text-decoration: underline; }
        .status-red { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div id="app">
    <div class="header-blue"></div>

    <div id="p-home" class="page active">
        <div class="container">
            <h2 style="text-align:center;">バス運行情報システム</h2>
            <a href="#" class="menu-item" onclick="navTo('p-search')">時刻表/バス接近情報</a>
            <a href="#" class="menu-item" onclick="navTo('p-vehicle')">車両検索</a>
        </div>
    </div>

    <div id="p-search" class="page">
        <div class="container">
            <span class="back-link" onclick="goBackToHome()">← ホームへ戻る</span>
            <div id="step-info">
                <h3 id="search-title">■ 乗車停留所を入力</h3>
                <div id="dep-selected-display" class="selected-box" style="display:none;"></div>
                <input type="text" id="searchInput" placeholder="例：宮園">
                <button onclick="getSuggestions()">候補を表示</button>
                <div id="suggestArea" class="suggest-area"></div>
            </div>
        </div>
    </div>

    <div id="p-result" class="page">
        <div class="container">
            <span class="back-link" onclick="navTo('p-search')">← 再検索</span>
            <h3 id="res-route-name">結果</h3>
            <div id="results-list"></div>
        </div>
    </div>

    <div id="p-vehicle" class="page">
        <div class="container">
            <span class="back-link" onclick="navTo('p-home')">← 戻る</span>
            <h3>■ 車両番号を入力</h3>
            <input type="text" id="vInput" placeholder="例：801">
            <button onclick="searchVehicle()">検索</button>
            <div id="vResults" style="margin-top:15px;"></div>
        </div>
    </div>
</div>

// --- 変数管理 ---
let selDep = "";
let selArr = "";
let currentStep = "dep"; // "dep" or "arr"
const stopList = [];

// 停留所リスト作成
busDatabase.operations.forEach(op => {
    op.trips.forEach(trip => {
        trip.stops.forEach(s => { if(!stopList.includes(s.name)) stopList.push(s.name); });
    });
});

// --- 関数 ---
function navTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

function goBackToHome() {
    resetSearchState();
    navTo('p-home');
}

function resetSearchState() {
    selDep = "";
    selArr = "";
    currentStep = "dep";
    document.getElementById('search-title').innerText = "■ 乗車停留所を入力";
    document.getElementById('dep-selected-display').style.display = "none";
    document.getElementById('searchInput').value = "";
    document.getElementById('suggestArea').innerHTML = "";
}

function getSuggestions() {
    const val = document.getElementById('searchInput').value.trim();
    const area = document.getElementById('suggestArea');
    
    // 入力エリアを一旦クリア
    area.innerHTML = "";
    
    if(!val) return; // 空入力の場合は何もしない

    // 検索実行
    const matches = stopList.filter(s => s.includes(val));
    
    if(matches.length > 0) {
        // 候補がある場合
        matches.forEach(m => {
            const d = document.createElement('div');
            d.className = "suggest-item";
            d.innerText = m;
            d.onclick = () => selectStop(m);
            area.appendChild(d);
        });
    } else {
        // 【修正ポイント】アラートではなく、エリア内にメッセージを表示
        const noData = document.createElement('div');
        noData.style.padding = "15px";
        noData.style.color = "#666";
        noData.style.backgroundColor = "#f8f8f8";
        noData.innerText = "該当する停留所が見つかりません";
        area.appendChild(noData);
    }
}

function selectStop(name) {
    if(currentStep === "dep") {
        selDep = name;
        currentStep = "arr";
        document.getElementById('search-title').innerText = "■ 降車停留所を入力";
        document.getElementById('dep-selected-display').innerText = "乗車： " + name;
        document.getElementById('dep-selected-display').style.display = "block";
        document.getElementById('searchInput').value = "";
        document.getElementById('suggestArea').innerHTML = "";
    } else {
        selArr = name;
        showResult();
    }
}

function showResult() {
    const list = document.getElementById('results-list');
    document.getElementById('res-route-name').innerText = `${selDep} → ${selArr}`;
    list.innerHTML = "";
    const now = new Date();

    let hits = [];
    busDatabase.operations.forEach(op => {
        op.trips.forEach(trip => {
            const dIdx = trip.stops.findIndex(s => s.name === selDep);
            const aIdx = trip.stops.findIndex(s => s.name === selArr);
            if(dIdx !== -1 && aIdx !== -1 && dIdx < aIdx) {
                const s = trip.stops[dIdx];
                const [th, tm] = s.time.split(':').map(Number);
                const target = new Date();
                target.setHours(th, tm, 0);
                const diff = Math.floor((target - now) / 60000);
                if(diff >= -2) hits.push({ diff, ...trip, stop: s, vid: op.vehicle_id });
            }
        });
    });

    if(hits.length === 0) {
        list.innerHTML = "該当するバスはありません。歩いてください。";
    } else {
        hits.sort((a,b) => a.diff - b.diff).forEach(h => {
            let st = h.diff === 0 ? "まもなく到着" : h.diff < 0 ? "到着済み" : "あと " + h.diff + " 分";
            list.innerHTML += `
                <div class="bus-card">
                    <b>[${h.route}]</b>　${h.vid}号車<br>
                    ${h.stop.time}発 (${h.stop.plat||'-'}番のりば)<br>
                    状態：<span class="status-red">${st}</span>
                </div>`;
        });
    }
    navTo('p-result');
}

function searchVehicle() {
    const val = document.getElementById('vInput').value.trim();
    const res = document.getElementById('vResults');
    res.innerHTML = "";
    if(!val) return;
    
    // 車両ごとの最新行程を表示
    busDatabase.operations.forEach(op => {
        if(op.vehicle_id.includes(val)) {
            op.trips.forEach(t => {
                res.innerHTML += `
                    <div class="bus-card">
                        <b>${op.vehicle_id}号車</b><br>
                        系統：${t.route}<br>
                        始発：${t.stops[0].name} ${t.stops[0].time}
                    </div>`;
            });
        }
    });
    if(!res.innerHTML) res.innerHTML = "見つかりません";
}
