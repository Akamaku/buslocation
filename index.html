let selDep = "", selArr = "", currentStep = "dep";
const stopList = [];
busDatabase.operations.forEach(op => {
    op.trips.forEach(trip => {
        trip.stops.forEach(s => { if(!stopList.includes(s.name)) stopList.push(s.name); });
    });
});

function navTo(id) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById(id).style.display = 'block';
}

function goBackToHome() { resetSearchState(); navTo('p-home'); }

function resetSearchState() {
    selDep = ""; selArr = ""; currentStep = "dep";
    document.getElementById('search-title').innerText = "■ 乗車停留所を入力";
    document.getElementById('dep-selected-display').style.display = "none";
    document.getElementById('searchInput').value = "";
    document.getElementById('suggestArea').innerHTML = "";
}

function getSuggestions() {
    const val = document.getElementById('searchInput').value.trim();
    const area = document.getElementById('suggestArea');
    area.innerHTML = "";
    if(!val) return;
    const matches = stopList.filter(s => s.includes(val));
    if(matches.length > 0) {
        matches.forEach(m => {
            const d = document.createElement('div');
            d.innerText = m;
            d.style.cursor = "pointer";
            d.onclick = () => selectStop(m);
            area.appendChild(d);
        });
    } else {
        area.innerHTML = "該当する停留所が見つかりません";
    }
}

function selectStop(name) {
    if(currentStep === "dep") {
        selDep = name;
        currentStep = "arr";
        document.getElementById('search-title').innerText = "■ 降車停留所を入力";
        document.getElementById('dep-selected-display').innerText = "乗車： " + name;
        document.getElementById('dep-selected-display').style.display = "block";
        document.getElementById('searchInput').value = "";
        document.getElementById('suggestArea').innerHTML = "";
    } else {
        selArr = name;
        showResult();
    }
}

function showResult() {
    const list = document.getElementById('results-list');
    document.getElementById('res-route-name').innerText = `${selDep} → ${selArr}`;
    list.innerHTML = "";
    const now = new Date();
    let hits = [];
    busDatabase.operations.forEach(op => {
        op.trips.forEach(trip => {
            const dIdx = trip.stops.findIndex(s => s.name === selDep);
            const aIdx = trip.stops.findIndex(s => s.name === selArr);
            if(dIdx !== -1 && aIdx !== -1 && dIdx < aIdx) {
                const s = trip.stops[dIdx];
                const [th, tm] = s.time.split(':').map(Number);
                const target = new Date();
                target.setHours(th, tm, 0);
                const diff = Math.floor((target - now) / 60000);
                if(diff >= -2) hits.push({ diff, ...trip, stop: s, vid: op.vehicle_id });
            }
        });
    });
    if(hits.length === 0) {
        list.innerHTML = "該当するバスはありません。";
    } else {
        hits.sort((a,b) => a.diff - b.diff).forEach(h => {
            let st = h.diff === 0 ? "まもなく到着" : h.diff < 0 ? "到着済み" : "あと " + h.diff + " 分";
            list.innerHTML += `<div><b>[${h.route}]</b> ${h.vid}号車 / ${h.stop.time}発 (${h.stop.plat||'-'}番) / ${st}</div><hr>`;
        });
    }
    navTo('p-result');
}

function searchVehicle() {
    const val = document.getElementById('vInput').value.trim();
    const res = document.getElementById('vResults');
    res.innerHTML = "";
    if(!val) return;
    busDatabase.operations.forEach(op => {
        if(op.vehicle_id.includes(val)) {
            op.trips.forEach(t => {
                res.innerHTML += `<div><b>${op.vehicle_id}号車</b> / 系統：${t.route} / 始発：${t.stops[0].name} ${t.stops[0].time}</div><hr>`;
            });
        }
    });
    if(!res.innerHTML) res.innerHTML = "見つかりません";
}
